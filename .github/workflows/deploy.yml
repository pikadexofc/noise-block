name: Build APK and Deploy Web App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy Built APK to docs for web download
        run: |
          mkdir -p docs
          cp app/build/outputs/apk/debug/app-debug.apk docs/NoiseBlock.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoiseBlock-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  deploy-web-app:
    name: Deploy Web App to GitHub Pages
    needs: build-android-apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: NoiseBlock-APK
          path: docs/

      - name: Rename APK in docs
        run: |
          mv docs/app-debug.apk docs/NoiseBlock.apk || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
